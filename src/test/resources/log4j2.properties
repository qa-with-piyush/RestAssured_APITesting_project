# Root logger
Loggers.Root.level = INFO
Loggers.Root.AppenderRef[1].ref = FILE
Loggers.Root.AppenderRef[2].ref = STDOUT


# =========================================================
# Rolling File Appender
# =========================================================

Appenders.RollingFile.name = FILE
Appenders.RollingFile.fileName = ${sys:user.dir}/logs/restAPI.log
Appenders.RollingFile.filePattern = ${sys:user.dir}/logs/restAPI-%i.log

Appenders.RollingFile.PatternLayout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

Appenders.RollingFile.policies.type = Policies
Appenders.RollingFile.policies.SizeBasedTriggeringPolicy.type = SizeBasedTriggeringPolicy
Appenders.RollingFile.policies.SizeBasedTriggeringPolicy.size = 10MB

Appenders.RollingFile.strategy.type = DefaultRolloverStrategy
Appenders.RollingFile.strategy.max = 10


# =========================================================
# Console Appender
# =========================================================

Appenders.Console.name = STDOUT
Appenders.Console.target = SYSTEM_OUT
Appenders.Console.PatternLayout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n